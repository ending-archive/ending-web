<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3NDING | Books Archive</title>
    <meta name="theme-color" content="#171b21" />
    <meta
      name="description"
      content="Explore a growing library of stories and read them online or offline."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/index.css" />
    <link
      rel="preload"
      href="fonts/fraunces.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/worksans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/spacemono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  </head>

  <body>
    <header>
      <div class="eyebrow">Books Archive</div>
      <h1>3NDING</h1>
      <p class="sub">
        Explore a growing library of stories and dive into your next great read.
      </p>
      <button type="button" class="install-app-btn" id="installAppBtn" hidden>
        Install 3NDING
      </button>
    </header>

    <section
      class="reading-summary"
      aria-label="Reading streak and weekly goal"
    >
      <div class="reading-streak">
        <span class="reading-summary-label">Current streak</span>
        <strong id="readingStreak">0 days</strong>
      </div>
      <div class="reading-goal">
        <div class="reading-goal-heading">
          <label class="reading-summary-label" for="weeklyGoal">
            Weekly goal
          </label>
          <select id="weeklyGoal" class="weekly-goal-select">
            <option value="1">1 day</option>
            <option value="2">2 days</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
            <option value="6">6 days</option>
            <option value="7">7 days</option>
          </select>
        </div>
        <div class="reading-goal-progress">
          <div
            class="reading-goal-track"
            id="weeklyGoalTrack"
            role="progressbar"
            aria-label="Weekly reading goal"
            aria-valuemin="0"
            aria-valuemax="3"
            aria-valuenow="0"
          >
            <span class="reading-goal-fill" id="weeklyGoalFill"></span>
          </div>
          <span
            class="reading-goal-count"
            id="weeklyGoalCount"
            aria-live="polite"
          >
            0 / 3 days
          </span>
        </div>
      </div>
    </section>

    <section
      class="continue-shelf"
      id="continueShelf"
      aria-labelledby="continueHeading"
      hidden
    >
      <div class="continue-heading">
        <h2 id="continueHeading">Continue reading</h2>
      </div>
      <div class="continue-grid" id="continueGrid"></div>
    </section>

    <main>
      <button
        type="button"
        class="controls-toggle"
        id="controlsToggle"
        aria-expanded="false"
        aria-controls="drawer"
      >
        <span aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-menu preview-icon"
          >
            <path d="M4 5h16" />
            <path d="M4 12h16" />
            <path d="M4 19h16" />
          </svg>
        </span>
        Browse &amp; Filter
      </button>

      <div class="drawer-backdrop" id="drawerBackdrop"></div>
      <aside
        class="drawer"
        id="drawer"
        aria-label="Browse and filter the archive"
      >
        <div class="drawer-head">
          <h2>Browse</h2>
          <button
            type="button"
            class="drawer-close"
            id="drawerCloseBtn"
            aria-label="Close browse panel"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-x preview-icon"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        <div
          class="archive-status"
          id="status"
          role="status"
          aria-live="polite"
        >
          <span class="dot"></span> Cataloging the archive…
        </div>

        <div class="search-row" id="searchRow" hidden>
          <label class="setting-label" for="searchInput">Search</label>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Title or author…"
            aria-label="Search by title or author"
          />
        </div>

        <span class="setting-label">Filter</span>
        <div class="fav-row" id="favRow" hidden>
          <button
            type="button"
            class="opt-btn fav-toggle"
            id="favToggle"
            aria-pressed="false"
          >
            <svg
              class="toggle-icon heart-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"
              />
            </svg>
            <span>My Favorites</span>
            <span class="fav-count" id="favCount">0</span>
          </button>
        </div>

        <div class="finished-row" id="finishedRow" hidden>
          <button
            type="button"
            class="opt-btn finished-toggle"
            id="finishedToggle"
            aria-pressed="false"
          >
            <svg
              class="toggle-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 7v14m0-14C10.5 5.7 8.3 5 5 5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2c3.3 0 5.5.7 7 2m0-15c1.5-1.3 3.7-2 7-2a2 2 0 0 1 2 2v6"
              />
              <path d="m15 17 2 2 4-4" />
            </svg>
            <span>Finished Books</span>
            <span class="finished-count" id="finishedCount">0</span>
          </button>
        </div>
      </aside>

      <div class="content">
        <h2 class="finished-view-heading" id="finishedHeading" hidden>
          Finished books
        </h2>
        <p class="no-results" id="noResults" hidden></p>
        <div class="grid" id="grid"></div>
        <nav class="pagination" id="pagination" hidden aria-label="Book pages">
          <button type="button" class="nav-btn" id="prevPageBtn">Prev</button>
          <span class="page-status" id="pageStatus" aria-live="polite"
            >Page 1 of 1</span
          >
          <button type="button" class="nav-btn" id="nextPageBtn">Next</button>
        </nav>
      </div>
    </main>

    <footer>
      <p>3NDING — a public archive, lovingly overdue.</p>
      <nav class="footer-links" aria-label="Help and legal">
        <a href="support">Support</a> | <a href="terms">Terms</a> |
        <a href="privacy">Privacy</a>
      </nav>
    </footer>
    <div
      class="share-status"
      id="shareStatus"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <script src="js/pwa.js" defer></script>
    <script src="js/index.js" defer></script>
  </body>
</html>
