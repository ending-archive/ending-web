<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3NDING | Books Archive</title>
    <meta name="theme-color" content="#171b21" />
    <meta
      name="description"
      content="Explore a growing library of stories and read them online."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="3NDING" />
    <meta property="og:title" content="3NDING | Books Archive" />
    <meta
      property="og:description"
      content="Explore a growing library of stories and read them online."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="css/index.css" />

    <link
      rel="preload"
      href="fonts/fraunces.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/worksans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/spacemono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  </head>

  <body>
    <header>
      <div class="eyebrow">Books Archive</div>
      <h1>3NDING</h1>
      <p class="sub">
        Explore a growing library of stories and dive into your next great read.
      </p>
    </header>

    <section
      class="continue-shelf"
      id="continueShelf"
      aria-labelledby="continueHeading"
      hidden
    >
      <div class="continue-heading">
        <h2 id="continueHeading">Continue reading</h2>
      </div>
      <div class="continue-grid" id="continueGrid"></div>
    </section>

    <main>
      <aside class="browse-panel" aria-label="Browse and filter the archive">
        <div class="browse-heading">
          <h2>Browse</h2>
        </div>

        <div class="search-row" id="searchRow" hidden>
          <label class="setting-label" for="searchInput">Search</label>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Title or author…"
            aria-label="Search by title or author"
          />
        </div>

        <div class="fav-row" id="favRow" hidden>
          <span class="setting-label">Filter</span>
          <button
            type="button"
            class="opt-btn fav-toggle"
            id="favToggle"
            aria-pressed="false"
          >
            <svg
              class="toggle-icon heart-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"
              />
            </svg>
            <span>My Favorites</span>
            <span class="fav-count" id="favCount">0</span>
          </button>
          <button
            type="button"
            class="opt-btn finished-toggle"
            id="finishedToggle"
            aria-pressed="false"
          >
            <svg
              class="toggle-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m5 12 4 4L19 6" />
            </svg>
            <span>Finished Books</span>
            <span class="fav-count" id="finishedCount">0</span>
          </button>
        </div>
      </aside>

      <div class="content">
        <noscript>
          <p class="no-results">
            3NDING needs JavaScript to list and read books. Please enable it and
            reload the page.
          </p>
        </noscript>
        <div
          class="archive-status"
          id="status"
          role="status"
          aria-live="polite"
        >
          <span class="dot"></span> Cataloging the archive…
        </div>
        <p class="no-results" id="noResults" hidden></p>
        <div class="grid" id="grid"></div>
        <nav class="pagination" id="pagination" hidden aria-label="Book pages">
          <button type="button" class="nav-btn" id="prevPageBtn">Prev</button>
          <span class="page-status" id="pageStatus" aria-live="polite"
            >Page 1 of 1</span
          >
          <button type="button" class="nav-btn" id="nextPageBtn">Next</button>
        </nav>
      </div>
    </main>

    <footer>
      <p>3NDING — a public archive, lovingly overdue.</p>
      <nav class="footer-links" aria-label="Help and legal">
        <a href="support.html">Support</a> | <a href="terms.html">Terms</a> |
        <a href="privacy.html">Privacy</a>
      </nav>
    </footer>
    <div
      class="share-status"
      id="shareStatus"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
