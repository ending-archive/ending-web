<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3NDING | Books Archive — Read Stories Online</title>
    <meta
      name="description"
      content="Explore 3NDING, a curated digital archive of short stories, books, and novellas. Read online for free, track your reading progress, and save your favorites."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="#171b21" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://ending-web.pages.dev/" />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="3NDING" />
    <meta property="og:url" content="https://ending-web.pages.dev/" />
    <meta property="og:title" content="3NDING | Books Archive — Read Stories Online" />
    <meta
      property="og:description"
      content="Explore 3NDING, a curated digital archive of short stories, books, and novellas. Read online for free, track your reading progress, and save your favorites."
    />
    <meta property="og:image" content="https://ending-web.pages.dev/android-chrome-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="3NDING Books Archive Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="3NDING | Books Archive — Read Stories Online" />
    <meta
      name="twitter:description"
      content="Explore 3NDING, a curated digital archive of short stories, books, and novellas. Read online for free, track your reading progress, and save your favorites."
    />
    <meta name="twitter:image" content="https://ending-web.pages.dev/android-chrome-512x512.png" />
    <meta name="twitter:image:alt" content="3NDING Books Archive Logo" />

    <!-- Performance: Preconnect & DNS-prefetch for book cover CDNs -->
    <link rel="preconnect" href="https://picsum.photos" />
    <link rel="dns-prefetch" href="https://picsum.photos" />
    <link rel="preconnect" href="https://fastly.picsum.photos" crossorigin />

    <!-- Performance: Preload catalog data & critical fonts -->
    <link
      rel="preload"
      href="books.json"
      as="fetch"
      type="application/json"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/fraunces.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/worksans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/spacemono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/index.css" />

    <!-- Icons & Manifest -->
    <link rel="manifest" href="site.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />

    <!-- Structured Data (JSON-LD) for SEO Rich Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://ending-web.pages.dev/#website",
            "url": "https://ending-web.pages.dev/",
            "name": "3NDING",
            "description": "Explore a growing library of stories and read them online.",
            "inLanguage": "en-US",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://ending-web.pages.dev/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "CollectionPage",
            "@id": "https://ending-web.pages.dev/#webpage",
            "url": "https://ending-web.pages.dev/",
            "name": "3NDING | Books Archive — Read Stories Online",
            "isPartOf": {
              "@id": "https://ending-web.pages.dev/#website"
            },
            "description": "A curated public archive of digital books and stories to read online.",
            "inLanguage": "en-US",
            "mainEntity": {
              "@type": "ItemList",
              "name": "Featured Archive Books",
              "itemListOrder": "https://schema.org/ItemListOrderAscending",
              "numberOfItems": 11,
              "itemListElement": [
                {
                  "@type": "ListItem",
                  "position": 1,
                  "name": "The Cartographer's Daughter",
                  "url": "https://ending-web.pages.dev/b/cartographers-daughter/"
                },
                {
                  "@type": "ListItem",
                  "position": 2,
                  "name": "Letters to a Young Botanist",
                  "url": "https://ending-web.pages.dev/b/letters-to-a-young-botanist/"
                },
                {
                  "@type": "ListItem",
                  "position": 3,
                  "name": "Of Silent Things",
                  "url": "https://ending-web.pages.dev/b/of-silent-things/"
                },
                {
                  "@type": "ListItem",
                  "position": 4,
                  "name": "The Year of Long Afternoons",
                  "url": "https://ending-web.pages.dev/b/year-of-long-afternoons/"
                },
                {
                  "@type": "ListItem",
                  "position": 5,
                  "name": "Anatomy of a Quiet Room",
                  "url": "https://ending-web.pages.dev/b/anatomy-of-a-quiet-room/"
                },
                {
                  "@type": "ListItem",
                  "position": 6,
                  "name": "The Last Lighthouse Keeper",
                  "url": "https://ending-web.pages.dev/b/last-lighthouse-keeper/"
                },
                {
                  "@type": "ListItem",
                  "position": 7,
                  "name": "Field Notes from the Edge",
                  "url": "https://ending-web.pages.dev/b/field-notes-from-the-edge/"
                },
                {
                  "@type": "ListItem",
                  "position": 8,
                  "name": "The Glasshouse Years",
                  "url": "https://ending-web.pages.dev/b/glasshouse-years/"
                },
                {
                  "@type": "ListItem",
                  "position": 9,
                  "name": "Slow Water",
                  "url": "https://ending-web.pages.dev/b/slow-water/"
                },
                {
                  "@type": "ListItem",
                  "position": 10,
                  "name": "A Pocket Book of Hours",
                  "url": "https://ending-web.pages.dev/b/pocket-book-of-hours/"
                },
                {
                  "@type": "ListItem",
                  "position": 11,
                  "name": "Middlemarch",
                  "url": "https://ending-web.pages.dev/b/middlemarch/"
                }
              ]
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <!-- Skip to content link for accessibility -->
    <a class="skip-link" href="#main">Skip to main content</a>

    <header>
      <div class="eyebrow">Books Archive</div>
      <h1>3NDING</h1>
      <p class="sub">
        Explore a growing library of stories and dive into your next great read.
      </p>
    </header>

    <section
      class="continue-shelf"
      id="continueShelf"
      aria-labelledby="continueHeading"
      hidden
    >
      <div class="continue-heading">
        <h2 id="continueHeading">Continue reading</h2>
      </div>
      <div class="continue-grid" id="continueGrid"></div>
    </section>

    <main id="main">
      <aside class="browse-panel" aria-label="Browse and filter the archive">
        <div class="browse-heading">
          <h2>Browse</h2>
        </div>

        <div class="search-row" id="searchRow" hidden>
          <label class="setting-label" for="searchInput">Search</label>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Title or author…"
            aria-label="Search by title or author"
          />
        </div>

        <div class="search-row skeleton-row" id="searchRowPh" hidden></div>

        <div class="fav-row" id="favRow" hidden>
          <span class="setting-label">Filter</span>
          <button
            type="button"
            class="opt-btn fav-toggle"
            id="favToggle"
            aria-pressed="false"
          >
            <svg
              class="toggle-icon heart-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"
              />
            </svg>
            <span>My Favorites</span>
            <span class="fav-count" id="favCount">0</span>
          </button>
          <div class="skeleton-row" id="favRowPh" hidden></div>
          <button
            type="button"
            class="opt-btn finished-toggle"
            id="finishedToggle"
            aria-pressed="false"
          >
            <svg
              class="toggle-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m5 12 4 4L19 6" />
            </svg>
            <span>Finished Books</span>
            <span class="fav-count" id="finishedCount">0</span>
          </button>
          <div class="skeleton-row" id="finishedRowPh" hidden></div>
        </div>
      </aside>

      <div class="content">
        <!-- Accessible fallback and direct crawling index for search engines -->
        <noscript>
          <div class="noscript-archive">
            <p class="no-results">
              3NDING is a public archive of short stories and novellas. Browse our catalog below:
            </p>
            <ul class="noscript-book-list">
              <li><a href="b/cartographers-daughter/">The Cartographer&apos;s Daughter — Eleanor Whitfield</a></li>
              <li><a href="b/letters-to-a-young-botanist/">Letters to a Young Botanist — H. T. Marwick</a></li>
              <li><a href="b/of-silent-things/">Of Silent Things — Yuki Tawara</a></li>
              <li><a href="b/year-of-long-afternoons/">The Year of Long Afternoons — Marco Bianchi</a></li>
              <li><a href="b/anatomy-of-a-quiet-room/">Anatomy of a Quiet Room — Iris Cole</a></li>
              <li><a href="b/last-lighthouse-keeper/">The Last Lighthouse Keeper — A. F. Pemberton</a></li>
              <li><a href="b/field-notes-from-the-edge/">Field Notes from the Edge — Tobias Lyle</a></li>
              <li><a href="b/glasshouse-years/">The Glasshouse Years — Petra Holm</a></li>
              <li><a href="b/slow-water/">Slow Water — Nadia Okafor</a></li>
              <li><a href="b/pocket-book-of-hours/">A Pocket Book of Hours — Anonymous</a></li>
              <li><a href="b/middlemarch/">Middlemarch — George Eliot</a></li>
            </ul>
          </div>
        </noscript>
        <div
          class="archive-status"
          id="status"
          role="status"
          aria-live="polite"
        >
          <span class="dot"></span> Cataloging the archive…
        </div>
        <p class="no-results" id="noResults" hidden></p>
        <div class="grid" id="grid"></div>
        <nav class="pagination" id="pagination" hidden aria-label="Book pages">
          <button type="button" class="nav-btn" id="prevPageBtn">Prev</button>
          <span class="page-status" id="pageStatus" aria-live="polite"
            >Page 1 of 1</span
          >
          <button type="button" class="nav-btn" id="nextPageBtn">Next</button>
        </nav>
      </div>
    </main>

    <footer>
      <p>3NDING — a public archive, lovingly overdue.</p>
      <nav class="footer-links" aria-label="Help and legal">
        <a href="support.html">Support</a> | <a href="terms.html">Terms</a> |
        <a href="privacy.html">Privacy</a>
      </nav>
    </footer>
    <div
      class="share-status"
      id="shareStatus"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
