<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3NDING | Reader</title>
    <link rel="stylesheet" href="css/reader.css" />
    <link
      rel="preload"
      href="fonts/fraunces.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/worksans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/spacemono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/literata.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  </head>

  <body class="theme-paper">
    <div class="topbar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="topbar-inner">
        <a href="index.html" class="back-link" id="backLink">archive</a>
        <div class="topbar-title" id="topbarTitle">Loading…</div>
        <div class="progress-pct" id="progressPct">0%</div>
        <button
          type="button"
          class="share-btn"
          id="shareBtn"
          aria-label="Share this book"
          title="Share this book"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <path d="m8.7 10.6 6.6-4.2M8.7 13.4l6.6 4.2" />
          </svg>
        </button>
        <button
          class="settings-btn"
          id="settingsBtn"
          aria-label="Reading settings"
          aria-expanded="false"
        >
          &#9881;
        </button>
      </div>
    </div>
    <div
      class="share-toast"
      id="shareStatus"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer" aria-label="Reading settings">
      <div class="drawer-head">
        <h2>Reading settings</h2>
        <button
          class="drawer-close"
          id="drawerCloseBtn"
          aria-label="Close settings"
        >
          &#10005;
        </button>
      </div>

      <div class="setting-group">
        <span class="setting-label">Font</span>
        <div class="option-row" id="fontRow" data-key="font">
          <button class="opt-btn" data-value="serif">Serif</button>
          <button class="opt-btn" data-value="sans">Sans</button>
          <button class="opt-btn" data-value="mono">Mono</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Text size</span>
        <div class="size-row">
          <button class="opt-btn" id="sizeDown" aria-label="Decrease text size">
            A-
          </button>
          <span class="size-value" id="sizeValue">17</span>
          <button class="opt-btn" id="sizeUp" aria-label="Increase text size">
            A+
          </button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Alignment</span>
        <div class="option-row" id="alignRow" data-key="align">
          <button class="opt-btn" data-value="left">Left</button>
          <button class="opt-btn" data-value="justify">Justify</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Theme</span>
        <div class="option-row" id="themeRow" data-key="theme">
          <button class="opt-btn" data-value="paper">Paper</button>
          <button class="opt-btn" data-value="sepia">Sepia</button>
          <button class="opt-btn" data-value="dark">Dark</button>
        </div>
      </div>

      <button class="reset-btn" id="resetBtn">Reset to defaults</button>
    </aside>

    <div class="reader-surface" id="readerSurface">
      <div class="state-box" id="stateBox">
        <span class="dot"></span> Opening the book…
      </div>
    </div>

    <script src="js/reader.js" defer></script>
  </body>
</html>
