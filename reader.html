<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3NDING | Reader</title>
    <meta name="theme-color" content="#171b21" />
    <meta
      name="description"
      content="Read stories from the 3NDING archive online."
    />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="3NDING" />
    <meta property="og:title" content="3NDING | Reader" />
    <meta
      property="og:description"
      content="Read stories from the 3NDING archive online."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="css/reader.css" />

    <link
      rel="preload"
      href="fonts/literata.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/fraunces.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/worksans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/spacemono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  </head>

  <body class="theme-paper">
    <script>
      try {
        const s =
          JSON.parse(localStorage.getItem("ending:settings") || "{}") || {};
        const prefersDark =
          typeof matchMedia === "function" &&
          matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = ["paper", "sepia", "dark"].includes(s.theme)
          ? s.theme
          : prefersDark
            ? "dark"
            : "paper";
        document.body.classList.remove(
          "theme-paper",
          "theme-sepia",
          "theme-dark",
        );
        document.body.classList.add("theme-" + theme);
        const root = document.documentElement.style;
        if (typeof s.size === "number" && Number.isFinite(s.size))
          root.setProperty(
            "--font-size",
            Math.min(26, Math.max(14, s.size)) / 16 + "rem",
          );
        if (s.align === "justify") root.setProperty("--text-align", "justify");
      } catch {}
    </script>
    <div class="topbar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="topbar-inner">
        <a href="index.html" class="back-link" id="backLink">archive</a>
        <div class="topbar-title" id="topbarTitle">Loading…</div>
        <div class="progress-pct" id="progressPct">0%</div>
        <button
          type="button"
          class="share-btn"
          id="shareBtn"
          aria-label="Share this book"
          title="Share this book"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <path d="m8.7 10.6 6.6-4.2M8.7 13.4l6.6 4.2" />
          </svg>
        </button>
        <button
          type="button"
          class="share-btn bookmark-btn"
          id="bookmarkBtn"
          aria-label="Bookmark this spot"
          title="Bookmark this spot (B)"
          disabled
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 3.75h12v17l-6-3.5-6 3.5z" />
          </svg>
        </button>
        <button
          type="button"
          class="settings-btn"
          id="settingsBtn"
          aria-label="Reading settings"
          title="Reader settings"
          aria-expanded="false"
          aria-controls="drawer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-settings preview-icon"
            aria-hidden="true"
          >
            <path
              d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </div>
    <div
      class="toast"
      id="shareStatus"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside
      class="drawer"
      id="drawer"
      aria-label="Reading settings"
      aria-hidden="true"
      inert
      role="dialog"
      aria-modal="true"
    >
      <div class="drawer-head">
        <h2>Reading settings</h2>
        <button
          type="button"
          class="drawer-close"
          id="drawerCloseBtn"
          aria-label="Close settings"
          title="Close settings"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-x preview-icon"
            aria-hidden="true"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>

      <div class="setting-group">
        <span class="setting-label">Font</span>
        <div class="option-row" id="fontRow" data-key="font">
          <button
            type="button"
            class="opt-btn"
            data-value="serif"
            aria-pressed="false"
          >
            Serif
          </button>
          <button
            type="button"
            class="opt-btn"
            data-value="sans"
            aria-pressed="false"
          >
            Sans
          </button>
          <button
            type="button"
            class="opt-btn"
            data-value="mono"
            aria-pressed="false"
          >
            Mono
          </button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Text size</span>
        <div class="size-row">
          <button
            type="button"
            class="opt-btn"
            id="sizeDown"
            aria-label="Decrease text size"
          >
            A-
          </button>
          <span class="size-value" id="sizeValue" aria-live="polite">17</span>
          <button
            type="button"
            class="opt-btn"
            id="sizeUp"
            aria-label="Increase text size"
          >
            A+
          </button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Alignment</span>
        <div class="option-row" id="alignRow" data-key="align">
          <button
            type="button"
            class="opt-btn"
            data-value="left"
            aria-pressed="false"
          >
            Left
          </button>
          <button
            type="button"
            class="opt-btn"
            data-value="justify"
            aria-pressed="false"
          >
            Justify
          </button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Theme</span>
        <div class="option-row" id="themeRow" data-key="theme">
          <button
            type="button"
            class="opt-btn"
            data-value="paper"
            aria-pressed="false"
          >
            Paper
          </button>
          <button
            type="button"
            class="opt-btn"
            data-value="sepia"
            aria-pressed="false"
          >
            Sepia
          </button>
          <button
            type="button"
            class="opt-btn"
            data-value="dark"
            aria-pressed="false"
          >
            Dark
          </button>
        </div>
      </div>

      <button class="reset-btn notes-open-btn" id="openNotesBtn" type="button">
        Bookmarks
      </button>
      <button class="reset-btn" id="resetBtn" type="button">
        Reset to defaults
      </button>
    </aside>

    <aside
      class="drawer notes-drawer"
      id="notesDrawer"
      aria-label="Bookmarks"
      aria-hidden="true"
      inert
      role="dialog"
      aria-modal="true"
    >
      <div class="drawer-head">
        <h2>Bookmarks</h2>
        <button
          type="button"
          class="drawer-close"
          id="notesCloseBtn"
          aria-label="Close bookmarks"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div class="notes-list" id="notesList"></div>
      <button
        type="button"
        class="reset-btn notes-export"
        id="exportNotesBtn"
        disabled
      >
        Export bookmarks as .txt
      </button>
    </aside>
    <main>
      <div class="reader-surface" id="readerSurface">
        <noscript>
          <div class="state-box">
            3NDING needs JavaScript to open books. Please enable it and reload.
          </div>
        </noscript>
        <div class="state-box" id="stateBox">
          <span class="dot"></span> Opening the book…
        </div>
      </div>
    </main>
    <script type="module" src="js/reader.js"></script>
  </body>
</html>
